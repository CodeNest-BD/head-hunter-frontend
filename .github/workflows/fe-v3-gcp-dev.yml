name: Deploy to GCP Dev

on:
  push:
    branches:
      - v3
      - v3-gcp
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: # allows manual trigger to restart a build process with updated secrets

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: head-hunter-cluster-1
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  DEPLOYMENT_NAME: head-hunter-frontend-dev
  IMAGE: head-hunter-frontend
  REGISTRY: ${{ secrets.GCP_ZONE }}-docker.pkg.dev
  REPOSITORY: ${{ secrets.GCP_PROJECT_ID }}/head-hunter/head-hunter-frontend
  NAMESPACE: dev

jobs:
  build:
    name: Build and Push Image
    runs-on: self-hosted
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: Configure Docker to use gcloud as credential helper
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_ZONE }}-docker.pkg.dev

      # Infisical CLI is preinstalled on the self-hosted runner during VM
      # bootstrap (see gcp-runner/startup.sh). Skipping the apt install
      # avoids needing passwordless `sudo bash` (the Cloudsmith setup.sh
      # is outside our NOPASSWD allowlist).
      - name: Verify Infisical CLI
        run: infisical --version

      - name: Build, tag, and push image to Artifact Registry
        id: build
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN_V3_DEV }}
        run: |
          infisical export --token=$INFISICAL_TOKEN --env=dev --format=dotenv > .env
          export $(cat .env | xargs)

          # Build a docker container and push it to Artifact Registry
          IMAGE_TAG=v3-${GITHUB_SHA::8}
          FULL_IMAGE_NAME=$REGISTRY/$REPOSITORY:$IMAGE_TAG
          FULL_IMAGE_LATEST=$REGISTRY/$REPOSITORY:v3-dev-latest

          # Self-hosted runner is n2-standard-4 (16 GiB). Bump V8 old
          # space from the Dockerfile's 5 GiB default to 10 GiB — gives
          # `next build` ~2x heap headroom (less GC pressure, faster
          # webpack passes) while leaving ~5 GiB for Docker, BuildKit,
          # and the runner agent. Staging/prod keep the 5 GiB default
          # because they build on ubuntu-latest (7 GiB).
          docker build \
            --build-arg NODE_OPTIONS=--max-old-space-size=10240 \
            --build-arg NEXT_PUBLIC_ACTIVITY_LOG_API_URL=$NEXT_PUBLIC_ACTIVITY_LOG_API_URL \
            --build-arg NEXT_PUBLIC_AI_CHAT_URL=$NEXT_PUBLIC_AI_CHAT_URL \
            --build-arg NEXT_PUBLIC_AI_URL=$NEXT_PUBLIC_AI_URL \
            --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
            --build-arg NEXT_PUBLIC_API_URL_V3=$NEXT_PUBLIC_API_URL_V3 \
            --build-arg NEXT_PUBLIC_AUTH_REFRESH_LEAD_MINUTES=$NEXT_PUBLIC_AUTH_REFRESH_LEAD_MINUTES \
            --build-arg NEXT_PUBLIC_COOKIE_DOMAIN=$NEXT_PUBLIC_COOKIE_DOMAIN \
            --build-arg NEXT_PUBLIC_COPILOT_API_URL=$NEXT_PUBLIC_COPILOT_API_URL \
            --build-arg NEXT_PUBLIC_COVARIATE_TIMEOUT=$NEXT_PUBLIC_COVARIATE_TIMEOUT \
            --build-arg NEXT_PUBLIC_ANALYTICS_HOST=$NEXT_PUBLIC_ANALYTICS_HOST \
            --build-arg NEXT_PUBLIC_ANALYTICS_KEY=$NEXT_PUBLIC_ANALYTICS_KEY \
            --build-arg NEXT_PUBLIC_ENVIRONMENT=$NEXT_PUBLIC_ENVIRONMENT \
            --build-arg NEXT_PUBLIC_EVENTS_SOCKET_URL=$NEXT_PUBLIC_EVENTS_SOCKET_URL \
            --build-arg NEXT_PUBLIC_FCM_VAPID_KEY=$NEXT_PUBLIC_FCM_VAPID_KEY \
            --build-arg NEXT_PUBLIC_FILES_UPLOAD_LIMIT=$NEXT_PUBLIC_FILES_UPLOAD_LIMIT \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=$NEXT_PUBLIC_FIREBASE_API_KEY \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=$NEXT_PUBLIC_FIREBASE_APP_ID \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=$NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=$NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=$NEXT_PUBLIC_GOOGLE_CLIENT_ID \
            --build-arg NEXT_PUBLIC_MSAL_CLIENT_ID=$NEXT_PUBLIC_MSAL_CLIENT_ID \
            --build-arg NEXT_PUBLIC_MSAL_AUTHORITY=$NEXT_PUBLIC_MSAL_AUTHORITY \
            --build-arg NEXT_PUBLIC_MSAL_REDIRECT_URI=$NEXT_PUBLIC_MSAL_REDIRECT_URI \
            --build-arg NEXT_PUBLIC_METABASE_URL=$NEXT_PUBLIC_METABASE_URL \
            --build-arg NEXT_PUBLIC_NOTEBOOK_URL=$NEXT_PUBLIC_NOTEBOOK_URL \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN \
            --build-arg NEXT_PUBLIC_SENTRY_ORG=$NEXT_PUBLIC_SENTRY_ORG \
            --build-arg NEXT_PUBLIC_SENTRY_PROJECT=$NEXT_PUBLIC_SENTRY_PROJECT \
            --build-arg NEXT_PUBLIC_SUPPORT_EMAIL=$NEXT_PUBLIC_SUPPORT_EMAIL \
            --build-arg NEXT_PUBLIC_SYNC_FUSION_LICENSE_KEY=$NEXT_PUBLIC_SYNC_FUSION_LICENSE_KEY \
            -t $FULL_IMAGE_NAME \
            -t $FULL_IMAGE_LATEST .
            
          docker push $FULL_IMAGE_NAME
          docker push $FULL_IMAGE_LATEST
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to GKE Dev
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: "Use gcloud CLI"
        run: "gcloud info"

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "$GKE_CLUSTER" --zone "$GCP_ZONE"

      - name: Update image in deployment
        run: |
          # Update the image in the deployment YAML
          sed -i "s|IMAGE_PLACEHOLDER|$REGISTRY/$REPOSITORY:${{ needs.build.outputs.image-tag }}|g" k8s/$NAMESPACE/deployment.yml

      - name: Deploy to GKE
        run: |
          APPLY_OUTPUT=$(kubectl apply -f k8s/$NAMESPACE/deployment.yml -n $NAMESPACE)
          kubectl apply -f k8s/$NAMESPACE/service.yml -n $NAMESPACE
          kubectl apply -f k8s/$NAMESPACE/hpa.yml -n $NAMESPACE
          kubectl apply -f k8s/$NAMESPACE/pdb.yml -n $NAMESPACE
          kubectl apply -f k8s/$NAMESPACE/ingress.yml -n $NAMESPACE

          # Force restart if deployment was unchanged to apply possible env change in infisical
          if echo "$APPLY_OUTPUT" | grep -q "unchanged"; then
            echo "Deployment unchanged, forcing rollout restart..."
            kubectl rollout restart deployment/$DEPLOYMENT_NAME -n $NAMESPACE
          fi

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n $NAMESPACE --timeout=600s
          kubectl get services -n $NAMESPACE
          kubectl get pods -n $NAMESPACE
          kubectl get hpa -n $NAMESPACE
          kubectl get ingress -n $NAMESPACE

      - name: Call Bug0 Webhook URL
        run: |
          curl -X POST https://webhooks.bug0.com/integrations/test/run -H "Content-Type: application/json" -H "x-api-key: ${{ secrets.BUG0_API_KEY }} " -d '{"url": "https://dev.head-hunter.example", "source": "head-hunter"}'
