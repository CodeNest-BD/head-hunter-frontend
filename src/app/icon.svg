<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    The brand crosshair. Geometry and colour mirror
    `src/shared/ui-components/brand/brandMark.ts`, measured off the supplied
    artwork; kept literal here because a static icon cannot import them.

    Ring centreline r=40 under an 8.5 stroke, broken by a 17.26° gap on each
    axis so the bars sit clear of both arc ends; bars 6 wide from r=28 to the
    edge; solid core r=18.5.

    Sits beside the existing favicon.ico rather than replacing it: an .ico
    cannot be authored here, and browsers that understand an SVG icon prefer
    it while older ones keep the raster fallback.
  -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#0d6efd" stroke-width="8.5"
          stroke-dasharray="50.78 12.05" transform="rotate(8.63 50 50)" />
  <rect x="47" y="0" width="6" height="22" fill="#0d6efd" />
  <rect x="47" y="78" width="6" height="22" fill="#0d6efd" />
  <rect x="0" y="47" width="22" height="6" fill="#0d6efd" />
  <rect x="78" y="47" width="22" height="6" fill="#0d6efd" />
  <circle cx="50" cy="50" r="18.5" fill="#0d6efd" />
</svg>
